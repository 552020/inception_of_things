# Documented copy of the manifest that Argo CD deploys. The live one is in the
# GitHub repository named in application.yaml; nothing in this folder applies this file.
# It starts at v1: the defense changes the tag to v2 in the repository and pushes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wil-playground
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wil-playground
  template:
    metadata:
      labels:
        app: wil-playground
    spec:
      containers:
        - name: wil-playground
          image: wil42/playground:v1
          ports:
            - containerPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: wil-playground
  namespace: dev
spec:
  type: NodePort
  selector:
    app: wil-playground
  ports:
    - port: 8888
      targetPort: 8888
      nodePort: 30007
