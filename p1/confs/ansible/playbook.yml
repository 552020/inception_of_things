---
# The worker reads the join token from the server over Ansible's SSH connection.

- name: Install K3s Server
  hosts: rpodackS
  gather_facts: no    # gathered below, once Python is there
  become: yes
  tasks:
    - name: Make sure Python is on the VM (Ansible needs it before any module can run)
      raw: test -x /usr/bin/python3 || (apt-get update && apt-get install -y python3)
      changed_when: false

    - name: Gather facts
      setup:
    - name: Set hostname in /etc/hostname
      copy:
        content: "rpodackS\n"
        dest: /etc/hostname
        owner: root
        group: root
        mode: '0644'

    - name: Set hostname in /etc/hosts
      lineinfile:
        path: /etc/hosts
        regexp: '^127.0.1.1'
        line: '127.0.1.1 rpodackS'
        state: present

    - name: Apply hostname immediately
      command: hostnamectl set-hostname rpodackS

    - name: Ensure cloud-init doesn't manage hostname (if cloud.cfg exists)
      stat:
        path: /etc/cloud/cloud.cfg
      register: cloud_cfg

    - name: Modify cloud-init config to preserve hostname if file exists
      lineinfile:
        path: /etc/cloud/cloud.cfg
        regexp: '^preserve_hostname:'
        line: 'preserve_hostname: true'
      when: cloud_cfg.stat.exists

    - name: Classic interface names eth0/eth1, as the subject requires (reboots once on first run)
      include_tasks: eth-names.yml

    - name: Ensure Python3 and curl are installed
      apt:
        name:
          - python3
          - curl
        state: present
        update_cache: yes
      become: yes

    - name: Install K3s server
      shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_EXEC="server --node-name rpodackS --write-kubeconfig-mode 644 --node-ip 192.168.56.110 --flannel-iface eth1" \
          sh -
      args:
        creates: /usr/local/bin/k3s
      become: yes

    - name: Wait for K3s server to be ready
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: 300
      become: yes



- name: Install K3s Worker
  hosts: rpodackSW
  gather_facts: no    # gathered below, once Python is there
  become: yes
  tasks:
    - name: Make sure Python is on the VM (Ansible needs it before any module can run)
      raw: test -x /usr/bin/python3 || (apt-get update && apt-get install -y python3)
      changed_when: false

    - name: Gather facts
      setup:

   #############make sure hostname is set
    - name: Set hostname in /etc/hostname
      copy:
        content: "rpodackSW\n"
        dest: /etc/hostname
        owner: root
        group: root
        mode: '0644'

    - name: Set hostname in /etc/hosts
      lineinfile:
        path: /etc/hosts
        regexp: '^127.0.1.1'
        line: '127.0.1.1 rpodackSW'
        state: present

    - name: Apply hostname immediately
      command: hostnamectl set-hostname rpodackSW

    - name: Ensure cloud-init doesn't manage hostname (if cloud.cfg exists)
      stat:
        path: /etc/cloud/cloud.cfg
      register: cloud_cfg

    - name: Modify cloud-init config to preserve hostname if file exists
      lineinfile:
        path: /etc/cloud/cloud.cfg
        regexp: '^preserve_hostname:'
        line: 'preserve_hostname: true'
      when: cloud_cfg.stat.exists

    - name: Classic interface names eth0/eth1, as the subject requires (reboots once on first run)
      include_tasks: eth-names.yml

    - name: Ensure Python3 and curl are installed
      apt:
        name:
          - python3
          - curl
        state: present
        update_cache: yes
      become: yes

    - name: Wait for K3s server to be ready
      wait_for:
        host: 192.168.56.110
        port: 6443
        timeout: 300

    - name: Wait for server token file to exist
      wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 120
      delegate_to: rpodackS
      become: yes

    - name: Read server token directly from server (using Ansible SSH)
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: token_file
      delegate_to: rpodackS
      become: yes
      retries: 5
      delay: 2

    - name: Set token
      set_fact:
        k3s_token: "{{ token_file.content | b64decode | trim }}"

    - name: Install K3s agent
      shell: curl -sfL https://get.k3s.io | K3S_URL=https://192.168.56.110:6443 K3S_TOKEN={{ k3s_token }} INSTALL_K3S_EXEC="agent --node-ip 192.168.56.111 --flannel-iface eth1" sh -
      become: yes
      async: 300   # run asynchronously, 5 min max
      poll: 0

- name: Verify Cluster
  hosts: rpodackS
  tasks:
    - name: Check cluster nodes
      command: k3s kubectl get nodes
      register: nodes_output
      become: yes

    - name: Show cluster nodes
      debug:
        msg: "{{ nodes_output.stdout_lines }}"

