<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Part 2 running: one server, three apps behind Traefik</title>
<style>
  :root { --paper:#fbfaf6; --ink:#1d1d1b; --soft:#6b6a66; --accent:#b4531a; }
  html, body { margin:0; background:var(--paper); color:var(--ink); }
  body { padding:16px; font-family:"Bradley Hand","Segoe Print","Comic Sans MS","Chalkboard SE",cursive; }
  svg { display:block; width:100%; height:auto; max-width:1500px; margin:0 auto; }
  .line  { fill:none; stroke:var(--ink); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .thin  { fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .plan  { stroke-dasharray:9 7; }
  .fill  { fill:var(--paper); }
  .dot   { fill:var(--accent); stroke:none; }
  .t     { font-size:22px; fill:var(--ink); }
  .h     { font-size:30px; fill:var(--ink); }
  .col   { font-size:24px; fill:var(--soft); letter-spacing:1px; }
  .s     { font-size:18px; fill:var(--soft); }
  .a     { font-size:18px; fill:var(--accent); }
  .mono  { font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace; font-size:17px; fill:var(--ink); }
</style>
</head>
<body>
<svg viewBox="0 0 1500 910" role="img" aria-label="Part 2 in its final state: curl with a Host header reaches Traefik on port 80, which routes to three Services and their pods">

    <filter id="hand" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#1d1d1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g filter="url(#hand)">
    <rect x="20" y="70" width="1460" height="720" rx="10" class="line"/>
    <rect x="340" y="170" width="1100" height="520" rx="8" class="line fill"/>
    <rect x="370" y="250" width="200" height="410" rx="4" class="thin fill plan"/>
    <rect x="60" y="250" width="220" height="110" rx="6" class="line fill plan"/>
    <rect x="710" y="250" width="190" height="110" rx="4" class="thin fill plan"/>

    <rect x="1010" y="468" width="80" height="30" rx="4" class="thin fill plan"/>
    <rect x="1100" y="468" width="80" height="30" rx="4" class="thin fill plan"/>
    <rect x="1190" y="468" width="80" height="30" rx="4" class="thin fill plan"/>

    <path d="M282,305 L368,305" class="line plan" marker-end="url(#arrow)"/>
    <path d="M572,305 L708,305" class="line plan" marker-end="url(#arrow)"/>
    <path d="M902,305 L988,305" class="line plan" marker-end="url(#arrow)"/>

    <path d="M902,605 L988,605" class="line plan" marker-end="url(#arrow)"/>
  </g>

  <circle cx="290" cy="305" r="7" class="dot"/>
  <circle cx="290" cy="455" r="7" class="dot"/>
  <circle cx="290" cy="605" r="7" class="dot"/>

  <text x="750" y="46" class="h" text-anchor="middle">Part 2 running: one server, three apps behind Traefik</text>
  <text x="170" y="130" class="col" text-anchor="middle">CLIENT</text>
  <text x="170" y="158" class="s" text-anchor="middle">the host VM</text>

  <text x="312" y="280" class="s" text-anchor="middle">:80</text>

  <text x="78" y="458" class="mono">Host: app2.com</text>

  <text x="78" y="580" class="t">curl</text>

  <text x="78" y="634" class="s">to 192.168.56.110</text>
  <text x="312" y="580" class="s" text-anchor="middle">:80</text>

  <text x="365" y="232" class="s">192.168.56.110, K3s server, 1 CPU, 1024 MB</text>
  <text x="390" y="285" class="t">Traefik</text>

  <text x="728" y="458" class="s">port 80, to 5678</text>

  <text x="728" y="608" class="s">port 80, to 5678</text>
  <text x="1010" y="280" class="t">app1: 1 pod</text>

  <text x="1126" y="490" class="s">pod</text>
  <text x="1216" y="490" class="s">pod</text>
  <text x="1010" y="580" class="t">app3: 1 pod</text>
  <text x="1010" y="608" class="s">http-echo, port 5678</text>
  <text x="1010" y="634" class="a">the default</text>

  <circle cx="60" cy="832" r="7" class="dot"/>
  <text x="78" y="838" class="s">who opens the connection</text>
  <path d="M330,832 L400,832" class="line plan"/>
  <text x="414" y="838" class="s">written, not run yet</text>
  <text x="60" y="868" class="s">A request travels: curl, Traefik on port 80, a Service, a pod. Nothing else runs in Part 2 besides K3s itself.</text>
