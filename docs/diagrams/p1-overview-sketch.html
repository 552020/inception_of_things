<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Part 1: two VMs and a K3s cluster</title>
<style>
  :root { --paper:#fbfaf6; --ink:#1d1d1b; --soft:#6b6a66; --accent:#b4531a; }
  html, body { margin:0; background:var(--paper); color:var(--ink); }
  body { padding:16px; font-family:"Bradley Hand","Segoe Print","Comic Sans MS","Chalkboard SE",cursive; }
  svg { display:block; width:100%; height:auto; max-width:1500px; margin:0 auto; }
  .line  { fill:none; stroke:var(--ink); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .thin  { fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .plan  { stroke-dasharray:9 7; }
  .fill  { fill:var(--paper); }
  .dot   { fill:var(--accent); stroke:none; }
  .t     { font-size:22px; fill:var(--ink); }
  .h     { font-size:30px; fill:var(--ink); }
  .col   { font-size:24px; fill:var(--soft); letter-spacing:1px; }
  .s     { font-size:18px; fill:var(--soft); }
  .a     { font-size:18px; fill:var(--accent); }
  .mono  { font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace; font-size:17px; fill:var(--ink); }
</style>
</head>
<body>
<svg viewBox="0 0 1500 910" role="img" aria-label="Part 1: the host VM runs Vagrant and Ansible, which build two VMs and install a K3s server and an agent">

  <circle cx="1170" cy="255" r="7" class="dot"/>

  <text x="750" y="46" class="h" text-anchor="middle">Part 1: two VMs and a K3s cluster</text>
  <text x="195" y="130" class="col" text-anchor="middle">HOST VM</text>
  <text x="195" y="158" class="s" text-anchor="middle">where we type</text>
  <text x="750" y="130" class="col" text-anchor="middle">THE STEPS</text>
  <text x="750" y="158" class="s" text-anchor="middle">what happens, in order</text>
  <text x="1305" y="130" class="col" text-anchor="middle">THE TWO VMS</text>
  <text x="1305" y="158" class="s" text-anchor="middle">on the private network eth1</text>
  <text x="88" y="228" class="t">Host VM</text>
  <text x="255" y="245" class="mono" text-anchor="middle">make</text>
  <text x="88" y="284" class="s">Ubuntu 26.04, QEMU/KVM</text>
  <text x="88" y="308" class="s">Vagrant, libvirt, Ansible</text>
  <text x="88" y="334" class="a">make up = vagrant up</text>
  <text x="88" y="356" class="a">(it provisions by itself)</text>
  <text x="88" y="418" class="t">make provision</text>
  <text x="88" y="444" class="s">re-runs the playbook</text>
  <text x="88" y="470" class="s">on VMs that exist</text>
  <text x="88" y="494" class="a">the server stalled</text>
  <text x="88" y="608" class="t">make test</text>
  <text x="88" y="634" class="s">hostnames, eth1, nodes</text>
  <text x="88" y="658" class="s">waits for the worker</text>
  <text x="88" y="682" class="a">then checks Ready</text>
  <text x="410" y="222" class="a" text-anchor="middle">you type</text>
  <text x="410" y="244" class="s" text-anchor="middle">make up</text>
  <text x="418" y="470" class="a" text-anchor="middle">re-run</text>
  <text x="418" y="492" class="s" text-anchor="middle">(stalls)</text>
  <text x="410" y="690" class="a" text-anchor="middle">checks</text>
  <text x="410" y="712" class="s" text-anchor="middle">(make test)</text>
  <text x="525" y="208" class="t">What make up does</text>
  <text x="525" y="234" class="s">vagrant up, then Ansible over SSH</text>
  <text x="543" y="289" class="mono">0</text>
  <text x="575" y="276" class="t">vagrant up</text>
  <text x="575" y="300" class="s">creates both VMs, box debian-13</text>
  <text x="543" y="365" class="mono">1</text>
  <text x="575" y="352" class="t">rename the interfaces</text>
  <text x="575" y="376" class="s">eth0 and eth1, one reboot each</text>
  <text x="543" y="441" class="mono">2</text>
  <text x="575" y="428" class="t">K3s server</text>
  <text x="575" y="452" class="s">on rpodackS, node IP 192.168.56.110</text>
  <text x="543" y="517" class="mono">3</text>
  <text x="575" y="504" class="t">join token</text>
  <text x="575" y="528" class="s">read from the server over SSH</text>
  <text x="543" y="593" class="mono">4</text>
  <text x="575" y="580" class="t">K3s agent</text>
  <text x="575" y="604" class="s">on rpodackSW, joins with the token</text>
  <text x="543" y="669" class="mono">5</text>
  <text x="575" y="656" class="t">check</text>
  <text x="575" y="680" class="s">kubectl get nodes: both Ready</text>
  <text x="1198" y="228" class="t">rpodackS</text>
  <text x="1198" y="256" class="s">server, 192.168.56.110</text>
  <text x="1198" y="280" class="s">1 CPU, 1024 MB</text>
  <text x="1198" y="304" class="a">K3s server</text>
  <text x="1198" y="418" class="t">rpodackSW</text>
  <text x="1198" y="446" class="s">worker, 192.168.56.111</text>
  <text x="1198" y="470" class="s">1 CPU, 512 MB</text>
  <text x="1198" y="494" class="a">K3s agent</text>
  <text x="1198" y="608" class="t">the cluster</text>
  <text x="1198" y="636" class="s">2 nodes Ready</text>
  <text x="1198" y="660" class="s">make up: 102 s</text>
  <text x="1198" y="684" class="a">box already cached</text>
  <text x="1332" y="356" class="a">join token</text>
  <text x="1088" y="208" class="a" text-anchor="middle">installs</text>
  <text x="1088" y="230" class="s" text-anchor="middle">the server</text>
  <text x="1110" y="598" class="a" text-anchor="middle">installs</text>
  <text x="1110" y="620" class="s" text-anchor="middle">the agent</text>
  <text x="1085" y="690" class="a" text-anchor="middle">both Ready</text>

  <circle cx="60" cy="832" r="7" class="dot"/>
  <text x="78" y="838" class="s">who starts the step</text>
  <path d="M330,832 L400,832" class="line plan"/>
  <text x="414" y="838" class="s">known problem, cause not found yet</text>
  <text x="60" y="868" class="s">Both VMs talk over eth1 (192.168.56.0/24). eth0 is only for Vagrant's SSH and the internet.</text>
  <text x="60" y="896" class="a">Status: run on 2026-11-22. make up passes in 102 s; the second provisioning pass (make provision) stalled the server twice.</text>
  <text x="1480" y="838" class="s" text-anchor="end">As of: 22 November 2026</text>
</svg>
</body>
</html>
