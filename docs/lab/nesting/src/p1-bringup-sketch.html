<style>
  :root { --paper:#fbfaf6; --ink:#1d1d1b; --soft:#6b6a66; --accent:#b4531a; }

  svg { display:block; width:100%; height:auto; max-width:1500px; margin:0 auto; }

  .thin  { fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .plan  { stroke-dasharray:9 7; }
  .svc   { stroke:var(--accent); stroke-width:2.2; }
  .acc   { stroke:var(--accent); }
  .fill  { fill:var(--paper); }
  .dot   { fill:var(--accent); stroke:none; }
  .door  { fill:var(--accent); stroke:var(--ink); stroke-width:1.6; }
  .ca { fill:var(--accent); stroke:var(--ink); stroke-width:1; }
  .cb { fill:var(--ink); stroke:var(--ink); stroke-width:1; }
  .cc { fill:#c9c6bd; stroke:var(--ink); stroke-width:1; }
  .cs { fill:url(#hatch); stroke:var(--ink); stroke-width:1; }
  .ce { fill:none; stroke:#cfcdc6; stroke-width:1; }
  .pw { fill:#f3d9c6; stroke:var(--accent); stroke-width:2; }

  .cz { fill:none; stroke:var(--accent); stroke-width:3; }
  .t     { font-size:22px; fill:var(--ink); }
  .h     { font-size:30px; fill:var(--ink); }
  .col   { font-size:24px; fill:var(--soft); letter-spacing:1px; }
  .s     { font-size:18px; fill:var(--soft); }
  .xs    { font-size:16px; fill:var(--soft); }
  .a     { font-size:18px; fill:var(--accent); }
  .mono  { font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace; font-size:17px; fill:var(--ink); }
  .monoa { font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace; font-size:16px; fill:var(--accent); }

  <circle cx="46" cy="40" r="6" class="dot"/>
  <text x="750" y="46" class="h" text-anchor="middle">Part 1: how it comes up, step by step</text>
  <text x="150" y="122" class="col" text-anchor="middle">THE HOST VM</text>
  <text x="150" y="150" class="s" text-anchor="middle">where we type</text>
  <text x="680" y="122" class="col" text-anchor="middle">THE STEPS</text>
  <text x="680" y="150" class="s" text-anchor="middle">what happens, in order</text>
  <text x="1260" y="122" class="col" text-anchor="middle">WHAT EXISTS NOW</text>
  <text x="1260" y="150" class="s" text-anchor="middle">after each step</text>
  <text x="46" y="232" class="t">Host VM</text>
  <text x="46" y="262" class="s">Ubuntu under QEMU/KVM</text>
  <text x="46" y="286" class="s">Vagrant, libvirt, Ansible</text>
  <text x="46" y="320" class="xs">you type:</text>
  <text x="46" y="342" class="a">make up</text>
  <text x="362" y="230" class="t">0</text>
  <text x="396" y="228" class="t">vagrant up</text>
  <text x="396" y="252" class="s">creates both VMs from the box debian-13</text>
  <text x="1002" y="228" class="a" text-anchor="end">Vagrant, libvirt</text>
  <text x="1074" y="228" class="s">two qemu processes, two VMs booted, no</text>
  <text x="1074" y="250" class="xs">K3s yet</text>
  <text x="362" y="331" class="t">1</text>
  <text x="396" y="329" class="t">rename the interfaces</text>
  <text x="396" y="353" class="s">eth0 and eth1, one reboot each</text>
  <text x="1002" y="329" class="a" text-anchor="end">Ansible, over SSH</text>
  <text x="1074" y="329" class="s">eth0 (NAT) and eth1 with</text>
  <text x="1074" y="351" class="xs">192.168.56.110 and .111</text>
  <text x="362" y="432" class="t">2</text>
  <text x="396" y="430" class="t">K3s server on rpodackS</text>
  <text x="396" y="454" class="s">node IP 192.168.56.110, flannel on eth1</text>
  <text x="1002" y="430" class="a" text-anchor="end">Ansible</text>
  <text x="1074" y="430" class="s">process k3s server, API server :6443;</text>
  <text x="1074" y="452" class="xs">add-on pods start: coredns, traefik,</text>
  <text x="1074" y="474" class="xs">metrics-server, local-path</text>
  <text x="362" y="533" class="t">3</text>
  <text x="396" y="531" class="t">join token</text>
  <text x="396" y="555" class="s">read from the server over SSH</text>
  <text x="1002" y="531" class="a" text-anchor="end">Ansible</text>
  <text x="1074" y="531" class="s">the token, in the playbook run</text>
  <text x="362" y="634" class="t">4</text>
  <text x="396" y="632" class="t">K3s agent on rpodackSW</text>
  <text x="396" y="656" class="s">joins https://192.168.56.110:6443 with the token</text>
  <text x="1002" y="632" class="a" text-anchor="end">Ansible</text>
  <text x="1074" y="632" class="s">process k3s agent; the cluster has two</text>
  <text x="1074" y="654" class="xs">nodes</text>
  <text x="362" y="735" class="t">5</text>
  <text x="396" y="733" class="t">check</text>
  <text x="396" y="757" class="s">kubectl get nodes: both Ready</text>
  <text x="1002" y="733" class="a" text-anchor="end">make test, you</text>
  <text x="1074" y="733" class="s">a working cluster, no apps of ours</text>
  <text x="60" y="898" class="s">Vagrant starts the VMs and then calls Ansible, which does steps 1 to 4 over SSH. After that Vagrant and Ansible are gone; only the VMs and K3s run.</text>
  <text x="60" y="926" class="s">make up passed in 102 s on 22 November 2026.</text>
  <text x="60" y="954" class="a">Known: the second provisioning pass (make provision) stalled the server twice; the cause is not found yet.</text>
  <text x="1480" y="954" class="s" text-anchor="end">As of: 22 November 2026</text>
  <text x="62" y="47" class="s">who types the command</text>
