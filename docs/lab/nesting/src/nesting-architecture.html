<title>Kubernetes architecture, with the technologies we use</title>
<style>
  :root { --paper:#fbfaf6; --ink:#1d1d1b; --soft:#6b6a66; --accent:#b4531a; }

  body { padding:16px; font-family:"Patrick Hand","Bradley Hand","Segoe Print","Comic Sans MS","Chalkboard SE",cursive; }

  .fill  { fill:var(--paper); }
  .dot   { fill:var(--accent); stroke:none; }

  .cb { fill:var(--ink); stroke:var(--ink); stroke-width:1; }
  .cc { fill:#c9c6bd; stroke:var(--ink); stroke-width:1; }
  .cs { fill:url(#hatch); stroke:var(--ink); stroke-width:1; }
  .ce { fill:none; stroke:#cfcdc6; stroke-width:1; }
  .pw { fill:#f3d9c6; stroke:var(--accent); stroke-width:2; }
  .pa { fill:#ffffff; stroke:var(--ink); stroke-width:2.2; }
  .pk { fill:#dedbd2; stroke:var(--ink); stroke-width:1.4; }
  .ps { fill:url(#hatch); stroke:var(--ink); stroke-width:1.4; }
  .cn { fill:#fbfaf6; stroke:var(--ink); stroke-width:1.3; }
  .cz { fill:none; stroke:var(--accent); stroke-width:3; }
  .t     { font-size:22px; fill:var(--ink); }
  .h     { font-size:30px; fill:var(--ink); }
  .col   { font-size:24px; fill:var(--soft); letter-spacing:1px; }
  .s     { font-size:18px; fill:var(--soft); }
  .xs    { font-size:16px; fill:var(--soft); }
  .a     { font-size:18px; fill:var(--accent); }
  .mono  { font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace; font-size:17px; fill:var(--ink); }
  .monoa { font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace; font-size:16px; fill:var(--accent); }

  <text x="750" y="46" class="h" text-anchor="middle">Kubernetes architecture, with the technologies we use</text>
  <text x="32" y="138" class="t">kubectl</text>
  <text x="32" y="164" class="xs">a client, you type it</text>
  <text x="32" y="186" class="xs">asks the API server</text>
  <text x="32" y="280" class="t">Vagrant</text>
  <text x="32" y="306" class="xs">client of libvirt</text>
  <text x="32" y="328" class="xs">controls the VMs (1, 2)</text>
  <text x="32" y="422" class="t">Ansible</text>
  <text x="32" y="448" class="xs">client, runs once</text>
  <text x="32" y="470" class="xs">installs K3s (1, 2)</text>
  <text x="32" y="564" class="t">k3d, Docker</text>
  <text x="32" y="590" class="xs">client of Docker</text>
  <text x="32" y="612" class="xs">builds the cluster (3)</text>
  <text x="32" y="706" class="t">GitHub, GitLab</text>
  <text x="32" y="732" class="xs">outside, or inside</text>
  <text x="32" y="754" class="xs">Argo CD follows it</text>
  <text x="840" y="104" class="col" text-anchor="middle">THE CLUSTER</text>
  <text x="236" y="146" class="t">Control plane</text>
  <text x="420" y="146" class="a">K3s runs all of it as one process, k3s server</text>
  <text x="250" y="196" class="t">kube-apiserver</text>
  <text x="250" y="224" class="s">:6443, the only door in</text>
  <text x="553" y="196" class="t">kube-scheduler</text>
  <text x="553" y="224" class="s">picks a node for each pod</text>
  <text x="856" y="196" class="t">controller manager</text>
  <text x="856" y="224" class="s">keeps what the manifests say</text>
  <text x="1159" y="196" class="t">datastore</text>
  <text x="1159" y="224" class="s">SQLite in K3s, etcd elsewhere</text>
  <text x="236" y="320" class="s">What the API server stores: Namespace, Deployment, ReplicaSet, Pod, Service, Ingress, ConfigMap, Secret, Node</text>
  <text x="236" y="344" class="xs">Argo CD and kubectl work on these objects</text>
  <text x="238" y="404" class="t">Node 1: the server</text>
  <text x="238" y="428" class="s">a node that also runs the control plane</text>
  <text x="248" y="470" class="s">kubelet</text>
  <text x="248" y="494" class="xs">starts the pods</text>
  <text x="395" y="470" class="s">kube-proxy</text>
  <text x="395" y="494" class="xs">Service ports</text>
  <text x="542" y="470" class="s">containerd</text>
  <text x="542" y="494" class="xs">runs containers</text>
  <text x="689" y="470" class="s">Flannel</text>
  <text x="689" y="494" class="xs">pod network, eth1</text>
  <text x="238" y="540" class="xs">Pods on this node (the placement is the scheduler&#x27;s choice, an example here):</text>
  <text x="868" y="404" class="t">Node 2: a worker, the agent</text>
  <text x="868" y="428" class="s">joins with the server address and a token</text>
  <text x="878" y="470" class="s">kubelet</text>
  <text x="878" y="494" class="xs">starts the pods</text>
  <text x="1025" y="470" class="s">kube-proxy</text>
  <text x="1025" y="494" class="xs">Service ports</text>
  <text x="1172" y="470" class="s">containerd</text>
  <text x="1172" y="494" class="xs">runs containers</text>
  <text x="1319" y="470" class="s">Flannel</text>
  <text x="1319" y="494" class="xs">pod network, eth1</text>
  <text x="868" y="540" class="xs">Pods on this node (the placement is the scheduler&#x27;s choice, an example here):</text>

  <text x="262" y="790" class="xs">container</text>
  <text x="445" y="724" class="s">Pod local-path</text>

  <text x="1087" y="650" class="xs">container</text>
  <text x="1270" y="584" class="t">Pod Argo CD</text>
  <text x="1270" y="610" class="xs">UI, sync, repo-server</text>
  <text x="1282" y="650" class="xs">container</text>
  <text x="880" y="724" class="t">Pod GitLab</text>
  <text x="880" y="750" class="xs">bonus: one pod, gitlab-ce</text>
  <text x="892" y="790" class="xs">container</text>
  <text x="1075" y="724" class="t">Pod the app</text>
  <text x="1075" y="750" class="xs">Part 3: wil-playground</text>
  <text x="1087" y="790" class="xs">container</text>
  <text x="1270" y="724" class="s">Pod more pods</text>
  <text x="1270" y="750" class="xs">up to 110 on a node</text>
  <text x="1282" y="790" class="xs">container</text>
  <text x="60" y="898" class="s">Read it from the outside in: cluster, control plane and objects, node, components and pods, container. Outside the cluster are the tools that build it and ask it.</text>
  <text x="60" y="926" class="s">K3s bundles containerd, Flannel, CoreDNS, Traefik, ServiceLB, metrics-server and local-path in one binary; full Kubernetes installs each of them on its own. Argo CD v2.7.12 runs inside the cluster as pods.</text>
  <text x="60" y="954" class="a">Which pods sit on which node is shown as an example: the scheduler decides, to be read from kubectl get pods -A -o wide.</text>
