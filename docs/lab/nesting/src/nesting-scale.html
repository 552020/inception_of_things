  body { padding:16px; font-family:"Patrick Hand","Bradley Hand","Segoe Print","Comic Sans MS","Chalkboard SE",cursive; }

  .cs { fill:url(#hatch); stroke:var(--ink); stroke-width:1; }
  .ce { fill:none; stroke:#cfcdc6; stroke-width:1; }
  .pw { fill:#f3d9c6; stroke:var(--accent); stroke-width:2; }
  .pa { fill:#ffffff; stroke:var(--ink); stroke-width:2.2; }
  .pk { fill:#dedbd2; stroke:var(--ink); stroke-width:1.4; }
  .ps { fill:url(#hatch); stroke:var(--ink); stroke-width:1.4; }
  .cn { fill:#fbfaf6; stroke:var(--ink); stroke-width:1.3; }
  .cz { fill:none; stroke:var(--accent); stroke-width:3; }
  .t     { font-size:22px; fill:var(--ink); }
  .h     { font-size:30px; fill:var(--ink); }
  .col   { font-size:24px; fill:var(--soft); letter-spacing:1px; }
  .s     { font-size:18px; fill:var(--soft); }
  .xs    { font-size:16px; fill:var(--soft); }
  .a     { font-size:18px; fill:var(--accent); }

  <text x="750" y="46" class="h" text-anchor="middle">Kubernetes at scale: up to 110 pods on a node</text>
  <text x="40" y="104" class="col">THE CLUSTER</text>
  <text x="250" y="104" class="s">one control plane and many nodes: up to 5,000, with up to 150,000 pods together</text>
  <text x="65" y="160" class="t">Node 1: the server</text>
  <text x="65" y="184" class="s">also runs the control plane (API server :6443)</text>
  <text x="65" y="208" class="a">32 of 110 pods, 40 containers</text>
  <text x="485" y="160" class="t">Node 2: a worker</text>
  <text x="485" y="184" class="xs">a machine with its own kubelet, kube-proxy and containerd</text>
  <text x="485" y="208" class="a">69 of 110 pods, 88 containers</text>
  <text x="905" y="160" class="t">Node 3: a worker</text>
  <text x="905" y="184" class="xs">a machine with its own kubelet, kube-proxy and containerd</text>
  <text x="905" y="208" class="a">107 of 110 pods, 140 containers  (nearly full)</text>
  <text x="499" y="562" class="a">one pod, zoomed in: three containers</text>
  <text x="561" y="632" class="xs" text-anchor="middle">app</text>
  <text x="669" y="632" class="xs" text-anchor="middle">sidecar proxy</text>
  <text x="777" y="632" class="xs" text-anchor="middle">log shipper</text>
  <text x="65" y="550" class="s">each small square is a pod:</text>
  <text x="65" y="574" class="s">the unit Kubernetes places</text>
  <text x="65" y="598" class="s">and counts, not the container</text>
  <text x="905" y="550" class="s">at 110 the node is full:</text>
  <text x="905" y="574" class="s">the scheduler puts the next</text>
  <text x="905" y="598" class="s">pod on another node</text>
  <text x="1380" y="360" class="t" text-anchor="middle">more nodes</text>
  <text x="1380" y="390" class="a" text-anchor="middle">up to 5,000</text>
  <text x="1380" y="414" class="s" text-anchor="middle">in one cluster</text>
  <text x="82" y="763" class="s">web: one Deployment, replicas on every node</text>
  <text x="507" y="763" class="s">api: another Deployment</text>
  <text x="797" y="763" class="s">worker</text>
  <text x="917" y="763" class="s">system pod</text>
  <text x="1077" y="763" class="s">a free slot</text>
  <text x="60" y="898" class="s">Read it from the outside in: cluster, node, pod, container. Squares of one colour are the replicas of one Deployment, spread over the nodes by the scheduler.</text>
  <text x="60" y="926" class="s">The limits are the documented ones for large clusters: 110 pods per node, 5,000 nodes, 150,000 pods, at about two containers per pod or fewer.</text>
  <text x="60" y="954" class="a">The numbers of pods and containers in this picture are made up, to show the scale. Source of the limits: kubernetes.io, Considerations for large clusters.</text>
  <text x="1480" y="954" class="s" text-anchor="end">As of: 22 November 2026</text>
