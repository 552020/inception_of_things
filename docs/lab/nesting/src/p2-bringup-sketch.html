  <text x="750" y="46" class="h" text-anchor="middle">Part 2: how it comes up, step by step</text>
  <text x="170" y="122" class="col" text-anchor="middle">THE HOST VM</text>
  <text x="170" y="150" class="s" text-anchor="middle">where we type</text>
  <text x="680" y="122" class="col" text-anchor="middle">THE STEPS</text>
  <text x="680" y="150" class="s" text-anchor="middle">what happens, in order</text>
  <text x="1260" y="122" class="col" text-anchor="middle">WHAT EXISTS NOW</text>
  <text x="1260" y="150" class="s" text-anchor="middle">after each step</text>
  <text x="58" y="232" class="t">Host VM</text>
  <text x="58" y="262" class="s">Ubuntu under QEMU/KVM</text>
  <text x="58" y="286" class="s">Vagrant, libvirt, Ansible</text>
  <text x="58" y="320" class="xs">you type:</text>
  <text x="58" y="342" class="a">make up</text>
  <text x="362" y="230" class="t">0</text>
  <text x="396" y="228" class="t">vagrant up</text>
  <text x="396" y="252" class="s">creates the VM rpodackS, 1024 MB, from the box debian-13</text>
  <text x="1002" y="228" class="a" text-anchor="end">Vagrant, libvirt</text>
  <text x="1074" y="228" class="s">one qemu process, the VM booted, no</text>
  <text x="1074" y="250" class="xs">K3s yet</text>
  <text x="362" y="331" class="t">1</text>
  <text x="396" y="329" class="t">hostname and packages</text>
  <text x="396" y="353" class="s">hostname set, cloud-init told to keep it, python3 and curl</text>
  <text x="396" y="375" class="s">installed</text>
  <text x="1002" y="329" class="a" text-anchor="end">Ansible, over SSH</text>
  <text x="1074" y="329" class="s">the VM is named rpodackS and ready for</text>
  <text x="1074" y="351" class="xs">K3s</text>
  <text x="362" y="432" class="t">2</text>
  <text x="396" y="430" class="t">K3s server</text>
  <text x="396" y="454" class="s">installed, then wait until the API answers</text>
  <text x="1002" y="430" class="a" text-anchor="end">Ansible</text>
  <text x="1074" y="430" class="s">process k3s server, API server :6443;</text>
  <text x="1074" y="452" class="xs">add-on pods start: coredns, traefik,</text>
  <text x="1074" y="474" class="xs">...</text>
  <text x="362" y="533" class="t">3</text>
  <text x="396" y="531" class="t">app1</text>
  <text x="396" y="555" class="s">Deployment, Service and Ingress copied to the node and applied</text>
  <text x="1002" y="531" class="a" text-anchor="end">Ansible, kubectl</text>
  <text x="1074" y="531" class="s">pod app1 (nginx) behind Service app1</text>
  <text x="362" y="634" class="t">4</text>
  <text x="396" y="632" class="t">app3, then app2</text>
  <text x="396" y="656" class="s">the same three objects each; the Ingress of app3 has no host:</text>
  <text x="396" y="678" class="s">the default</text>
  <text x="1002" y="632" class="a" text-anchor="end">Ansible, kubectl</text>
  <text x="1074" y="632" class="s">pod app3; app2 with three pods;</text>
  <text x="1074" y="654" class="xs">Traefik routes by Host</text>
  <text x="362" y="735" class="t">5</text>
  <text x="396" y="733" class="t">check</text>
  <text x="396" y="757" class="s">the nodes are shown; then curl with a Host header</text>
  <text x="1002" y="733" class="a" text-anchor="end">you</text>
  <text x="1074" y="733" class="s">three Services answer: app1.com,</text>
  <text x="1074" y="755" class="xs">app2.com, anything else</text>
  <text x="60" y="898" class="s">Vagrant starts the VM and calls Ansible, which does steps 1 to 4 over SSH. Afterwards only the VM, K3s and the pods run.</text>
  <text x="60" y="926" class="s">Do not start it while the Part 1 VMs run: both use 192.168.56.110.</text>
  <text x="60" y="954" class="a">Status: written and reviewed, not run yet.</text>
