<title>Bonus running: GitLab and Argo CD in one k3d node</title>
<style>

  .fill  { fill:var(--paper); }
  .dot   { fill:var(--accent); stroke:none; }

  .ca { fill:var(--accent); stroke:var(--ink); stroke-width:1; }
  .cb { fill:var(--ink); stroke:var(--ink); stroke-width:1; }
  .cc { fill:#c9c6bd; stroke:var(--ink); stroke-width:1; }
  .cs { fill:url(#hatch); stroke:var(--ink); stroke-width:1; }
  .ce { fill:none; stroke:#cfcdc6; stroke-width:1; }
  .pw { fill:#f3d9c6; stroke:var(--accent); stroke-width:2; }
  .pa { fill:#ffffff; stroke:var(--ink); stroke-width:2.2; }
  .pk { fill:#dedbd2; stroke:var(--ink); stroke-width:1.4; }
  .ps { fill:url(#hatch); stroke:var(--ink); stroke-width:1.4; }
  .cn { fill:#fbfaf6; stroke:var(--ink); stroke-width:1.3; }
  .cz { fill:none; stroke:var(--accent); stroke-width:3; }
  .t     { font-size:22px; fill:var(--ink); }
  .h     { font-size:30px; fill:var(--ink); }
  .col   { font-size:24px; fill:var(--soft); letter-spacing:1px; }
  .s     { font-size:18px; fill:var(--soft); }
  .xs    { font-size:16px; fill:var(--soft); }
  .a     { font-size:18px; fill:var(--accent); }
  .mono  { font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace; font-size:17px; fill:var(--ink); }

  <text x="750" y="46" class="h" text-anchor="middle">Bonus running: GitLab and Argo CD in one k3d node</text>
  <text x="40" y="100" class="t">The computer at 42</text>
  <text x="60" y="150" class="t">Host VM</text>
  <text x="60" y="172" class="s">Ubuntu under QEMU/KVM</text>
  <text x="76" y="450" class="t">You</text>
  <text x="76" y="476" class="s">browser or git</text>
  <text x="76" y="502" class="mono">localhost:8929</text>
  <text x="76" y="528" class="a">push v2 here</text>
  <text x="76" y="630" class="t">curl</text>
  <text x="76" y="656" class="mono">localhost:8888</text>
  <text x="76" y="682" class="xs">&quot;message&quot;: &quot;v1&quot;</text>

  <text x="76" y="294" class="xs">cluster and talk to it;</text>
  <text x="76" y="314" class="xs">they act when you</text>
  <text x="76" y="334" class="xs">call them</text>
  <text x="1440" y="150" class="a" text-anchor="end">running here: the Docker daemon</text>
  <text x="268" y="220" class="t">Docker</text>
  <text x="268" y="244" class="s">the k3d node is a container: a process of Docker</text>
  <text x="288" y="290" class="t">k3d cluster bonus</text>
  <text x="470" y="290" class="a">one server node, no agent node</text>
  <text x="305" y="333" class="t">Server node</text>
  <text x="430" y="333" class="xs">a container running K3s: control plane, kubelet, kube-proxy, containerd</text>
  <text x="317" y="426" class="t">GitLab</text>
  <text x="317" y="448" class="xs">gitlab-ce, one container</text>
  <text x="317" y="470" class="a">ns: gitlab</text>
  <text x="327" y="532" class="s">container</text>
  <text x="327" y="552" class="mono">:8929</text>
  <text x="317" y="627" class="xs">its disk: a volume of the cluster</text>
  <text x="643" y="426" class="t">Git reader</text>
  <text x="643" y="448" class="xs">repo-server</text>
  <text x="643" y="470" class="a">ns: argocd</text>
  <text x="653" y="538" class="s">container</text>
  <text x="833" y="426" class="t">UI and API</text>
  <text x="833" y="448" class="xs">argocd-server</text>
  <text x="833" y="470" class="a">ns: argocd</text>
  <text x="843" y="532" class="s">container</text>
  <text x="843" y="552" class="mono">:443</text>
  <text x="1023" y="426" class="t">Sync engine</text>
  <text x="1023" y="448" class="xs">app-controller</text>
  <text x="1023" y="470" class="a">ns: argocd</text>
  <text x="1033" y="538" class="s">container</text>
  <text x="1229" y="426" class="t">The app</text>
  <text x="1229" y="448" class="xs">wil-playground</text>
  <text x="1229" y="470" class="a">ns: dev</text>
  <text x="1239" y="532" class="s">container</text>
  <text x="1239" y="552" class="mono">:8888</text>
  <text x="603" y="478" class="xs" text-anchor="middle">polls</text>
  <text x="1189" y="478" class="xs" text-anchor="middle">applies</text>
  <text x="244" y="484" class="mono">8929</text>
  <text x="760" y="690" class="s" text-anchor="middle">8888 to NodePort 30007: through the Service of the app into the pod</text>
  <text x="305" y="722" class="s">Argo CD finds the project at gitlab.gitlab.svc.cluster.local:8929/root/rpodackIoT.git,</text>
  <text x="305" y="746" class="s">the Service name inside the cluster; 8929 on the host is NodePort 30929 of the node.</text>
  <text x="60" y="898" class="s">Read it from the outside in: computer, host VM, Docker, cluster, node, pods, container. ns = namespace, a tag on the pod here. The Argo CD interface: make port-forward, then https://localhost:8080.</text>
  <text x="60" y="926" class="s">GitLab is the official image gitlab-ce as one Deployment, not the Helm chart; it fits in the memory of the host VM, the Helm chart would not.</text>
  <text x="60" y="954" class="a">Status: GitLab and Argo CD came up once; the push, Argo CD following the GitLab project and the change to v2 have not been run.</text>
