<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonus: how it comes up, step by step</title>
<style>
  :root { --paper:#fbfaf6; --ink:#1d1d1b; --soft:#6b6a66; --accent:#b4531a; }
  html, body { margin:0; background:var(--paper); color:var(--ink); }
  body { padding:16px; font-family:"Patrick Hand","Bradley Hand","Segoe Print","Comic Sans MS","Chalkboard SE",cursive; }
  svg { display:block; width:100%; height:auto; max-width:1500px; margin:0 auto; }
  .line  { fill:none; stroke:var(--ink); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .thin  { fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .plan  { stroke-dasharray:9 7; }
  .svc   { stroke:var(--accent); stroke-width:2.2; }
  .acc   { stroke:var(--accent); }
  .fill  { fill:var(--paper); }
  .dot   { fill:var(--accent); stroke:none; }
  .door  { fill:var(--accent); stroke:var(--ink); stroke-width:1.6; }
  .ca { fill:var(--accent); stroke:var(--ink); stroke-width:1; }
  .cb { fill:var(--ink); stroke:var(--ink); stroke-width:1; }
  .cc { fill:#c9c6bd; stroke:var(--ink); stroke-width:1; }
  .cs { fill:url(#hatch); stroke:var(--ink); stroke-width:1; }
  .ce { fill:none; stroke:#cfcdc6; stroke-width:1; }
  .pw { fill:#f3d9c6; stroke:var(--accent); stroke-width:2; }
  .pa { fill:#ffffff; stroke:var(--ink); stroke-width:2.2; }
  .pk { fill:#dedbd2; stroke:var(--ink); stroke-width:1.4; }
  .ps { fill:url(#hatch); stroke:var(--ink); stroke-width:1.4; }
  .cn { fill:#fbfaf6; stroke:var(--ink); stroke-width:1.3; }
  .cz { fill:none; stroke:var(--accent); stroke-width:3; }
  .t     { font-size:22px; fill:var(--ink); }
  .h     { font-size:30px; fill:var(--ink); }
  .col   { font-size:24px; fill:var(--soft); letter-spacing:1px; }
  .s     { font-size:18px; fill:var(--soft); }
  .xs    { font-size:16px; fill:var(--soft); }
  .a     { font-size:18px; fill:var(--accent); }
  .mono  { font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace; font-size:17px; fill:var(--ink); }
  .monoa { font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace; font-size:16px; fill:var(--accent); }
</style>
</head>
<body>
<svg viewBox="0 0 1500 960" role="img" aria-label="The bonus coming up: make setup creates the cluster, Argo CD and a GitLab; make repo and make deploy-app connect them">
  <defs>

      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>

    </filter>

      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#1d1d1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    
  </defs>
  <g filter="url(#hand)">

    <rect x="1060" y="352" width="400" height="62" rx="6" class="thin fill"/>
    <path d="M1016,383 L1056,383" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="428" width="668" height="62" rx="6" class="thin fill"/>
    <rect x="1060" y="428" width="400" height="62" rx="6" class="thin fill"/>

    <rect x="1060" y="580" width="400" height="62" rx="6" class="thin fill"/>

    <rect x="1060" y="656" width="400" height="62" rx="6" class="thin fill"/>
    <path d="M1016,687 L1056,687" class="line" marker-end="url(#arrow)"/>

    <rect x="1060" y="732" width="400" height="62" rx="6" class="thin fill"/>

  </g>
  <circle cx="306" cy="230" r="7" class="dot"/>
  <text x="750" y="46" class="h" text-anchor="middle">Bonus: how it comes up, step by step</text>
  <text x="170" y="122" class="col" text-anchor="middle">THE HOST VM</text>
  <text x="170" y="150" class="s" text-anchor="middle">where we type</text>
  <text x="680" y="122" class="col" text-anchor="middle">THE STEPS</text>
  <text x="680" y="150" class="s" text-anchor="middle">what happens, in order</text>
  <text x="1260" y="122" class="col" text-anchor="middle">WHAT EXISTS NOW</text>
  <text x="1260" y="150" class="s" text-anchor="middle">after each step</text>
  <text x="58" y="232" class="t">Host VM</text>
  <text x="58" y="262" class="s">Ubuntu under QEMU/KVM</text>
  <text x="58" y="286" class="s">Docker, k3d, kubectl, git, make</text>
  <text x="58" y="320" class="xs">you type:</text>
  <text x="58" y="342" class="a">make setup</text>
  <text x="362" y="230" class="t">0</text>
  <text x="396" y="228" class="t">check the tools</text>
  <text x="396" y="252" class="s">docker, kubectl, k3d, git and openssl present</text>
  <text x="1002" y="228" class="a" text-anchor="end">make</text>
  <text x="1074" y="228" class="s">the tools on the host VM</text>
  <text x="362" y="306" class="t">1</text>
  <text x="396" y="304" class="t">k3d cluster create bonus</text>
  <text x="396" y="328" class="s">one server node; host 8888 to 30007 and 8929 to 30929</text>
  <text x="1002" y="304" class="a" text-anchor="end">k3d, Docker</text>
  <text x="1074" y="304" class="s">one node container running K3s; the</text>
  <text x="1074" y="326" class="xs">cluster is empty</text>
  <text x="362" y="382" class="t">2</text>
  <text x="396" y="380" class="t">namespaces</text>
  <text x="396" y="404" class="s">argocd, dev and gitlab</text>
  <text x="1002" y="380" class="a" text-anchor="end">kubectl</text>
  <text x="1074" y="380" class="s">three empty namespaces</text>
  <text x="362" y="458" class="t">3</text>
  <text x="396" y="456" class="t">install Argo CD</text>
  <text x="396" y="480" class="s">its install manifest applied into argocd</text>
  <text x="1002" y="456" class="a" text-anchor="end">kubectl</text>
  <text x="1074" y="456" class="s">the Argo CD pods start</text>
  <text x="362" y="534" class="t">4</text>
  <text x="396" y="532" class="t">install GitLab</text>
  <text x="396" y="556" class="s">Secret gitlab-root, its disk, Deployment and Service</text>
  <text x="1002" y="532" class="a" text-anchor="end">kubectl</text>
  <text x="1074" y="532" class="s">the GitLab pod starts (gitlab-ce)</text>
  <text x="362" y="610" class="t">5</text>
  <text x="396" y="608" class="t">wait for GitLab</text>
  <text x="396" y="632" class="s">rollout status, up to 30 minutes (image, first start)</text>
  <text x="1002" y="608" class="a" text-anchor="end">make</text>
  <text x="1074" y="608" class="s">GitLab answers on localhost:8929</text>
  <text x="362" y="686" class="t">6</text>
  <text x="396" y="684" class="t">make repo</text>
  <text x="396" y="708" class="s">pushes the first commit, the app at v1, to root/rpodackIoT</text>
  <text x="1002" y="684" class="a" text-anchor="end">git</text>
  <text x="1074" y="684" class="s">the project in GitLab, private</text>
  <text x="362" y="762" class="t">7</text>
  <text x="396" y="760" class="t">make deploy-app</text>
  <text x="396" y="784" class="s">Secret gitlab-repo, then the Application dev-app</text>
  <text x="1002" y="760" class="a" text-anchor="end">kubectl</text>
  <text x="1074" y="760" class="s">Argo CD follows the GitLab project;</text>
  <text x="1074" y="782" class="xs">curl localhost:8888 answers v1</text>
  <text x="60" y="898" class="s">After that make v2 changes the image tag in the GitLab project; Argo CD notices it and the app answers v2. Delete the cluster of Part 3 first: both do not fit in memory.</text>
  <text x="60" y="926" class="s">make setup takes about 10 minutes, most of it GitLab.</text>
  <text x="60" y="954" class="a">Status: ran up to step 5 on 22 November 2026; steps 6 and 7 and the change to v2 have not been run.</text>
  <text x="1480" y="954" class="s" text-anchor="end">As of: 22 November 2026</text>
</svg>
</body>
</html>
