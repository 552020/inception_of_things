<title>Bonus running: Argo CD follows a GitLab that runs inside the cluster</title>
<style>

  .dot   { fill:var(--accent); stroke:none; }

  .cb { fill:var(--ink); stroke:var(--ink); stroke-width:1; }

  .cn { fill:#fbfaf6; stroke:var(--ink); stroke-width:1.3; }
  .cz { fill:none; stroke:var(--accent); stroke-width:3; }
  .t     { font-size:22px; fill:var(--ink); }
  .h     { font-size:30px; fill:var(--ink); }
  .col   { font-size:24px; fill:var(--soft); letter-spacing:1px; }
  .s     { font-size:18px; fill:var(--soft); }
  .xs    { font-size:16px; fill:var(--soft); }
  .a     { font-size:18px; fill:var(--accent); }

  <text x="750" y="46" class="h" text-anchor="middle">Bonus running: Argo CD follows a GitLab that runs inside the cluster</text>
  <text x="175" y="122" class="col" text-anchor="middle">YOU</text>
  <text x="175" y="150" class="s" text-anchor="middle">on the host VM</text>
  <text x="808" y="122" class="col" text-anchor="middle">THE CLUSTER</text>
  <text x="808" y="150" class="s" text-anchor="middle">k3d cluster bonus, one server node, in Docker, on the host VM</text>
  <text x="1390" y="122" class="col" text-anchor="middle">CLIENT</text>
  <text x="1390" y="150" class="s" text-anchor="middle">on the host VM</text>
  <text x="375" y="245" class="t">namespace gitlab</text>
  <text x="655" y="245" class="t">namespace argocd</text>
  <text x="1005" y="245" class="t">namespace dev</text>
  <text x="390" y="300" class="t">GitLab</text>

  <text x="390" y="641" class="s">written in the repository</text>

  <text x="1025" y="346" class="s">port 8888</text>
  <text x="1025" y="438" class="t">wil-playground</text>
  <text x="1025" y="462" class="s">image wil42/playground</text>

  <text x="1025" y="520" class="mono">:8888</text>

  <text x="58" y="392" class="s">browser or git, localhost</text>

  <text x="985" y="420" class="xs" text-anchor="middle">applies</text>
  <text x="1276" y="304" class="mono" text-anchor="middle">8888</text>
  <text x="78" y="848" class="s">who opens the connection</text>
  <text x="414" y="848" class="s">written, not run yet</text>
  <text x="60" y="876" class="s">Part 3 with one change: the repository Argo CD follows is a GitLab in the cluster, not GitHub. One server node, no agent. k3d publishes 8929 to NodePort 30929 and 8888 to NodePort 30007.</text>
  <text x="60" y="904" class="s">Argo CD reaches the project as gitlab.gitlab.svc.cluster.local:8929, the Service name inside the cluster.</text>
  <text x="60" y="932" class="a">Status: GitLab and Argo CD came up on 22 November 2026 (about 10 minutes); the push to GitLab, Argo CD following it and the change to v2 have not been run. Not together with Part 3: the memory does not fit.</text>
  <text x="1480" y="876" class="s" text-anchor="end">As of: 22 November 2026</text>
