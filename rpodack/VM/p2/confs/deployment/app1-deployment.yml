apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: app1
          image: hashicorp/http-echo:0.2.3
#          args:
#            - "-text=Hello from App1"
          ports:
            - containerPort: 5678
#    spec:
#      containers:
#        - name: app1
#          image: your-dockerhub-username/your-flask-app:latest  # Replace with your actual image
#          ports:
#            - containerPort: 80  # Flask app listens on port 80
---
apiVersion: v1
kind: Service
metadata:
  name: app1
spec:
  selector:
    app: app1
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5678
