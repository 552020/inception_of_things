---
# NOTE: Worker reads token from server via Ansible SSH delegation.
# This works in Vagrant (via Ansible's SSH) and in production environments.

- name: Install K3s Server
  hosts: rpodackS
  gather_facts: yes
  become: yes
  tasks:
    #############make sure hostnae is set
    - name: Set hostname in /etc/hostname
      copy:
        content: "rpodackS\n"
        dest: /etc/hostname
        owner: root
        group: root
        mode: "0644"

    - name: Set hostname in /etc/hosts
      lineinfile:
        path: /etc/hosts
        regexp: "^127.0.1.1"
        line: "127.0.1.1 rpodackS"
        state: present

    - name: Apply hostname immediately
      command: hostnamectl set-hostname rpodackS

    - name: Ensure cloud-init doesn't manage hostname (if cloud.cfg exists)
      stat:
        path: /etc/cloud/cloud.cfg
      register: cloud_cfg

    - name: Modify cloud-init config to preserve hostname if file exists
      lineinfile:
        path: /etc/cloud/cloud.cfg
        regexp: "^preserve_hostname:"
        line: "preserve_hostname: true"
      when: cloud_cfg.stat.exists
    #################################

    - name: Ensure Python3 and curl are installed
      apt:
        name:
          - python3
          - curl
        state: present
        update_cache: yes
      become: yes

    - name: Install K3s server
      shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_EXEC="server --node-name rpodackS --write-kubeconfig-mode 644" \
          sh -
      args:
        creates: /usr/local/bin/k3s
      become: yes

    - name: Wait for K3s server to be ready
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: 300
      become: yes

    - name: Wait for token file
      wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 60
      become: yes

    - name: Read server token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_content
      become: yes

- name: Install K3s Worker
  hosts: rpodackSW
  gather_facts: yes # we need facts for apt module
  become: yes
  tasks:
    #############make sure hostnae is set
    - name: Set hostname in /etc/hostname
      copy:
        content: "rpodackSW\n"
        dest: /etc/hostname
        owner: root
        group: root
        mode: "0644"

    - name: Set hostname in /etc/hosts
      lineinfile:
        path: /etc/hosts
        regexp: "^127.0.1.1"
        line: "127.0.1.1 rpodackSW"
        state: present

    - name: Apply hostname immediately
      command: hostnamectl set-hostname rpodackSW

    - name: Ensure cloud-init doesn't manage hostname (if cloud.cfg exists)
      stat:
        path: /etc/cloud/cloud.cfg
      register: cloud_cfg

    - name: Modify cloud-init config to preserve hostname if file exists
      lineinfile:
        path: /etc/cloud/cloud.cfg
        regexp: "^preserve_hostname:"
        line: "preserve_hostname: true"
      when: cloud_cfg.stat.exists
    ###################################

    - name: Ensure Python3 and curl are installed
      apt:
        name:
          - python3
          - curl
        state: present
        update_cache: yes
      become: yes

    - name: Wait for K3s server to be ready
      wait_for:
        host: 192.168.56.110
        port: 6443
        timeout: 300

    - name: Wait for server token file to exist
      wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 120
      delegate_to: rpodackS
      become: yes

    - name: Read server token directly from server (using Ansible SSH)
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: token_file
      delegate_to: rpodackS
      become: yes
      retries: 5
      delay: 2

    - name: Set token
      set_fact:
        k3s_token: "{{ token_file.content | b64decode | trim }}"

    - name: Install K3s agent
      shell: |
        curl -sfL https://get.k3s.io | \
          K3S_URL=https://192.168.56.110:6443 \
          K3S_TOKEN={{ k3s_token }} \
          INSTALL_K3S_EXEC="agent --node-name rpodackSW" \
          sh -
      become: yes
      register: k3s_agent_install
      changed_when: k3s_agent_install.rc == 0
      failed_when: k3s_agent_install.rc != 0
      # Note: Token read via Ansible SSH delegation (works in Vagrant and production)

    - name: Wait for K3s agent process to be running
      command: pgrep -x k3s-agent || pgrep -f "k3s agent"
      register: agent_check
      until: agent_check.rc == 0
      retries: 15
      delay: 5
      failed_when: false
      changed_when: false

- name: Verify Cluster
  hosts: rpodackS
  tasks:
    - name: Wait for K3s server to be fully ready
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: 60
      become: yes

    - name: Wait for at least one node (server) to be available
      command: k3s kubectl get nodes --no-headers
      register: nodes_output
      become: yes
      retries: 10
      delay: 5
      until: nodes_output.rc == 0 and nodes_output.stdout_lines | length >= 1
      failed_when: false
      changed_when: false

    - name: Wait for worker node to join cluster
      command: k3s kubectl get nodes --no-headers
      register: nodes_output
      become: yes
      retries: 20
      delay: 10
      until: nodes_output.rc == 0 and nodes_output.stdout_lines | length >= 2
      failed_when: false
      changed_when: false

    - name: Check cluster nodes
      command: k3s kubectl get nodes
      register: nodes_output
      become: yes

    - name: Show cluster nodes
      debug:
        msg: "{{ nodes_output.stdout_lines }}"

    - name: Verify both nodes are ready
      command: k3s kubectl get nodes --no-headers
      register: node_status
      become: yes
      changed_when: false

    - name: Display node status
      debug:
        var: node_status.stdout_lines
