---
# NOTE: This playbook uses /vagrant shared folder for token sharing.
# This works in Vagrant because both VMs share the same host filesystem.
# In production (separate physical servers), you would need network-based
# solutions (HTTP endpoint, SSH, secrets management, etc.)

- name: Install K3s Server
  hosts: slombardS
  gather_facts: no
  tasks:
    - name: Install Python3 and curl
      raw: apk add --no-cache python3 curl
      become: yes
      register: python_install

    - name: Setup Python for Ansible
      setup:
      when: python_install.changed

    - name: Install K3s server
      shell: curl -sfL https://get.k3s.io | sh -
      become: yes

    - name: Wait for K3s server to be ready
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: 300
      become: yes

    - name: Read server token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_content
      become: yes

    - name: Copy server token to shared folder for worker
      copy:
        content: "{{ k3s_token_content.content | b64decode | trim }}"
        dest: /vagrant/k3s_token
      # Note: Using /vagrant shared folder works in Vagrant but not in production

- name: Install K3s Worker
  hosts: slombardSW
  gather_facts: no
  tasks:
    - name: Install Python3 and curl
      raw: apk add --no-cache python3 curl
      become: yes
      register: python_install

    - name: Setup Python for Ansible
      setup:
      when: python_install.changed

    - name: Wait for K3s server to be ready
      wait_for:
        host: 192.168.56.110
        port: 6443
        timeout: 300
    
    - name: Wait for token file in shared folder
      wait_for:
        path: /vagrant/k3s_token
        timeout: 60
    
    - name: Read server token from shared folder
      slurp:
        src: /vagrant/k3s_token
      register: token_file
    
    - name: Set token
      set_fact:
        k3s_token: "{{ token_file.content | b64decode | trim }}"
    
    - name: Install K3s agent
      shell: curl -sfL https://get.k3s.io | K3S_URL=https://192.168.56.110:6443 K3S_TOKEN={{ k3s_token }} sh -
      become: yes
      # Note: Token read from /vagrant shared folder (Vagrant-only solution)

- name: Verify Cluster
  hosts: slombardS
  tasks:
    - name: Check cluster nodes
      command: k3s kubectl get nodes
      register: nodes_output
      become: yes

    - name: Show cluster nodes
      debug:
        msg: "{{ nodes_output.stdout_lines }}"

