# GitLab CE, the official Linux package image: one container that runs every GitLab
# service (web, Git storage, PostgreSQL, Redis, background jobs).
# Namespace gitlab is created by the Makefile, the Secret gitlab-root too.

# Disk for GitLab. K3s ships the local-path provisioner, which answers this claim
# with a directory on the node. Without it a restart of the pod would wipe GitLab.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
spec:
  replicas: 1
  # The disk can be mounted by one pod only: stop the old pod before starting a new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
        - name: gitlab
          # latest: the subject asks for the latest version from the official source
          image: gitlab/gitlab-ce:latest
          ports:
            - containerPort: 8929
          env:
            # Password of the user root, read once, when GitLab fills its database.
            # The first line after external_url below hands it to GitLab.
            - name: GITLAB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-root
                  key: password
            # Lines of /etc/gitlab/gitlab.rb, the one configuration file of the package.
            # external_url: the address GitLab prints in its pages and clone URLs.
            #   With port 8929 in it, GitLab listens on 8929 too.
            # The rest keeps memory low, from the GitLab page
            #   "Running GitLab in a memory-constrained environment":
            #   one web process, fewer job threads, no monitoring stack,
            #   no agent server, no container registry.
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://localhost:8929'
                gitlab_rails['initial_root_password'] = ENV['GITLAB_ROOT_PASSWORD']
                puma['worker_processes'] = 0
                sidekiq['concurrency'] = 5
                prometheus_monitoring['enable'] = false
                gitlab_kas['enable'] = false
                registry['enable'] = false
                gitlab_rails['env'] = { 'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000' }
                gitaly['env'] = { 'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000', 'GITALY_COMMAND_SPAWN_MAX_PARALLEL' => '2' }
          # The first start takes several minutes (database creation). Until the sign-in
          # page answers, the pod is not Ready and nothing is restarted: up to 20 minutes.
          startupProbe:
            httpGet:
              path: /users/sign_in
              port: 8929
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /users/sign_in
              port: 8929
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /etc/gitlab
              subPath: config
            - name: data
              mountPath: /var/log/gitlab
              subPath: logs
            - name: data
              mountPath: /var/opt/gitlab
              subPath: data
            # The package wants 256 MB of shared memory; a container gets 64 MB by default.
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitlab-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
# Inside the cluster: http://gitlab.gitlab.svc.cluster.local:8929  (what Argo CD uses)
# On the host:        http://localhost:8929  (K3d publishes NodePort 30929 as 8929)
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  type: NodePort
  selector:
    app: gitlab
  ports:
    - port: 8929
      targetPort: 8929
      nodePort: 30929
